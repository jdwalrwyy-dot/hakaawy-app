<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldAvatarFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="30%" stop-color="#FFE082"/>
      <stop offset="70%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <radialGradient id="emeraldTurban" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="35%" stop-color="#10B981"/>
      <stop offset="75%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </radialGradient>

    <linearGradient id="goldRobe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Gold Frame -->
  <circle cx="50" cy="50" r="42" fill="url(#goldAvatarFrame)"/>
  <circle cx="50" cy="50" r="37" fill="#047857"/>

  <!-- Character Clip Path -->
  <g>
    <!-- Gold/Emerald Robe / Shoulders -->
    <path d="M 22 88 C 22 68 35 62 50 62 C 65 62 78 68 78 88 Z" fill="url(#goldRobe)"/>
    <path d="M 38 62 L 50 78 L 62 62 Z" fill="url(#emeraldTurban)"/>

    <!-- Neck -->
    <rect x="44" y="50" width="12" height="15" fill="#F5C29B"/>

    <!-- Face Skin -->
    <ellipse cx="50" cy="42" rx="15" ry="17" fill="#F5C29B"/>

    <!-- Ears -->
    <circle cx="34" cy="42" r="3.5" fill="#E2A67C"/>
    <circle cx="66" cy="42" r="3.5" fill="#E2A67C"/>

    <!-- Hair & Beard -->
    <path d="M 35 38 C 35 28 65 28 65 38 C 65 40 63 42 63 42 C 63 52 58 57 50 57 C 42 57 37 52 37 42 Z" fill="#3B2314"/>
    <ellipse cx="50" cy="42" rx="14" ry="14" fill="#F5C29B"/>
    <!-- Mustache & Beard Trim -->
    <path d="M 42 47 Q 50 51 58 47 Q 54 55 50 55 Q 46 55 42 47 Z" fill="#29180E"/>
    <!-- Smile -->
    <path d="M 44 46 Q 50 50 56 46" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Eyes & Eyebrows -->
    <ellipse cx="44" cy="40" rx="2" ry="2.5" fill="#1F2937"/>
    <ellipse cx="56" cy="40" rx="2" ry="2.5" fill="#1F2937"/>
    <path d="M 41 36 Q 44 34 47 36" fill="none" stroke="#29180E" stroke-width="1.5"/>
    <path d="M 53 36 Q 56 34 59 36" fill="none" stroke="#29180E" stroke-width="1.5"/>

    <!-- Royal Emerald Green Turban with Gold Jewel -->
    <path d="M 32 30 C 30 14 70 14 68 30 C 72 26 72 34 68 36 C 60 38 40 38 32 36 C 28 34 28 26 32 30 Z" fill="url(#emeraldTurban)"/>
    <!-- Turban Fold Texture -->
    <path d="M 34 26 C 44 20 56 20 66 26" fill="none" stroke="url(#goldRobe)" stroke-width="1.5"/>

    <!-- Center Gold & Gem Brooch on Turban -->
    <circle cx="50" cy="24" r="4.5" fill="url(#goldAvatarFrame)"/>
    <circle cx="50" cy="24" r="2.5" fill="#047857"/>
    <circle cx="49" cy="23" r="0.8" fill="#FFF"/>
  </g>
</svg>
