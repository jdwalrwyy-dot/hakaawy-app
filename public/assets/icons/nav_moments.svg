<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldMedal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="25%" stop-color="#FFE082"/>
      <stop offset="60%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <radialGradient id="emeraldDisc" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="30%" stop-color="#10B981"/>
      <stop offset="70%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </radialGradient>
  </defs>

  <!-- Outer Gold Starburst Medallion Rim -->
  <g transform="translate(50,50)">
    <!-- 12 Gold Outer Filigree Petals -->
    <path d="M 0 -44 L 6 -36 L 0 -38 L -6 -36 Z" fill="url(#goldMedal)" transform="rotate(0)"/>
    <path d="M 0 -44 L 6 -36 L 0 -38 L -6 -36 Z" fill="url(#goldMedal)" transform="rotate(30)"/>
    <path d="M 0 -44 L 6 -36 L 0 -38 L -6 -36 Z" fill="url(#goldMedal)" transform="rotate(60)"/>
    <path d="M 0 -44 L 6 -36 L 0 -38 L -6 -36 Z" fill="url(#goldMedal)" transform="rotate(90)"/>
    <path d="M 0 -44 L 6 -36 L 0 -38 L -6 -36 Z" fill="url(#goldMedal)" transform="rotate(120)"/>
    <path d="M 0 -44 L 6 -36 L 0 -38 L -6 -36 Z" fill="url(#goldMedal)" transform="rotate(150)"/>
    <path d="M 0 -44 L 6 -36 L 0 -38 L -6 -36 Z" fill="url(#goldMedal)" transform="rotate(180)"/>
    <path d="M 0 -44 L 6 -36 L 0 -38 L -6 -36 Z" fill="url(#goldMedal)" transform="rotate(210)"/>
    <path d="M 0 -44 L 6 -36 L 0 -38 L -6 -36 Z" fill="url(#goldMedal)" transform="rotate(240)"/>
    <path d="M 0 -44 L 6 -36 L 0 -38 L -6 -36 Z" fill="url(#goldMedal)" transform="rotate(270)"/>
    <path d="M 0 -44 L 6 -36 L 0 -38 L -6 -36 Z" fill="url(#goldMedal)" transform="rotate(300)"/>
    <path d="M 0 -44 L 6 -36 L 0 -38 L -6 -36 Z" fill="url(#goldMedal)" transform="rotate(330)"/>

    <!-- Gold Circular Ring -->
    <circle cx="0" cy="0" r="37" fill="url(#goldMedal)"/>
    <circle cx="0" cy="0" r="32" fill="url(#emeraldDisc)"/>
    <circle cx="0" cy="0" r="32" stroke="url(#goldMedal)" stroke-width="2" fill="none"/>

    <!-- Inner Compass 8-Pointed Star -->
    <!-- Major Points (North, South, East, West) -->
    <polygon points="0,-28 5,-8 0,0 -5,-8" fill="url(#goldMedal)"/>
    <polygon points="0,28 5,8 0,0 -5,8" fill="url(#goldMedal)"/>
    <polygon points="-28,0 -8,5 0,0 -8,-5" fill="url(#goldMedal)"/>
    <polygon points="28,0 8,5 0,0 8,-5" fill="url(#goldMedal)"/>

    <!-- Minor Diagonal Points -->
    <polygon points="-18,-18 -4,-7 0,0 -7,-4" fill="#FFF9C4"/>
    <polygon points="18,-18 7,-4 0,0 4,-7" fill="#FFF9C4"/>
    <polygon points="-18,18 -4,7 0,0 -7,4" fill="#FFF9C4"/>
    <polygon points="18,18 7,4 0,0 4,7" fill="#FFF9C4"/>

    <!-- Center Emerald Jewel -->
    <circle cx="0" cy="0" r="7" fill="url(#goldMedal)"/>
    <circle cx="0" cy="0" r="4.5" fill="url(#emeraldDisc)"/>
    <circle cx="-1" cy="-1" r="1.5" fill="#FFF"/>
  </g>
</svg>
