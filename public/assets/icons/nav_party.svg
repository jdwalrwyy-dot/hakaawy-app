<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="65%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <!-- Emerald Green Dome Gradient -->
    <radialGradient id="emeraldGrad1" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="25%" stop-color="#10B981"/>
      <stop offset="65%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </radialGradient>
    <filter id="glowGold1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Gold Outer Aura -->
  <circle cx="50" cy="50" r="44" fill="url(#goldGrad1)" opacity="0.25"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#goldGrad1)" stroke-width="2.5" filter="url(#glowGold1)"/>

  <!-- Palace Main Structure -->
  <!-- Base Pedestal -->
  <path d="M 15 82 L 85 82 L 80 88 L 20 88 Z" fill="url(#goldGrad1)"/>
  <rect x="20" y="65" width="60" height="17" rx="3" fill="url(#goldGrad1)"/>
  <!-- Arch Doors -->
  <path d="M 42 82 L 42 70 Q 50 64 58 70 L 58 82 Z" fill="#064E3B"/>
  <path d="M 28 82 L 28 73 Q 33 69 38 73 L 38 82 Z" fill="#047857"/>
  <path d="M 62 82 L 62 73 Q 67 69 72 73 L 72 82 Z" fill="#047857"/>

  <!-- Left Minaret -->
  <rect x="22" y="32" width="8" height="35" rx="1" fill="url(#goldGrad1)"/>
  <path d="M 20 32 L 32 32 L 26 20 Z" fill="url(#emeraldGrad1)"/>
  <circle cx="26" cy="18" r="2" fill="url(#goldGrad1)"/>

  <!-- Right Minaret -->
  <rect x="70" y="32" width="8" height="35" rx="1" fill="url(#goldGrad1)"/>
  <path d="M 68 32 L 80 32 L 74 20 Z" fill="url(#emeraldGrad1)"/>
  <circle cx="74" cy="18" r="2" fill="url(#goldGrad1)"/>

  <!-- Main Center Emerald Dome -->
  <path d="M 32 65 C 30 38 40 24 50 20 C 60 24 70 38 68 65 Z" fill="url(#emeraldGrad1)"/>
  <!-- Gold Dome Lines -->
  <path d="M 40 65 C 40 45 46 32 50 21 C 54 32 60 45 60 65" fill="none" stroke="url(#goldGrad1)" stroke-width="1.5" opacity="0.8"/>

  <!-- Top Gold Spire & Crescent -->
  <line x1="50" y1="20" x2="50" y2="8" stroke="url(#goldGrad1)" stroke-width="2.5"/>
  <circle cx="50" cy="12" r="3" fill="url(#goldGrad1)"/>
  <path d="M 48 5 A 4 4 0 1 0 52 5 A 3 3 0 1 1 48 5" fill="url(#goldGrad1)"/>
</svg>
