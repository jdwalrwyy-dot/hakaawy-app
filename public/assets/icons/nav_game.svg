<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldCtrl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="25%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="80%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>

    <!-- Emerald Green Gradient -->
    <radialGradient id="emeraldBtn" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="80%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022C22"/>
    </radialGradient>
  </defs>

  <!-- Gold Outer Aura -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#goldCtrl)" stroke-width="2" opacity="0.6"/>

  <!-- Controller Main 3D Sculpted Body -->
  <path d="M 25 32 Q 50 26 75 32 Q 92 38 88 68 Q 84 84 70 80 Q 58 76 50 62 Q 42 76 30 80 Q 16 84 12 68 Q 8 38 25 32 Z" 
        fill="url(#goldCtrl)" 
        stroke="#B45309" 
        stroke-width="2"/>

  <!-- Left/Right Grip Emerald Panel Inlays -->
  <path d="M 20 40 Q 14 55 18 70 Q 24 74 30 68 Q 28 50 25 38 Z" fill="url(#emeraldBtn)" opacity="0.85"/>
  <path d="M 80 40 Q 86 55 82 70 Q 76 74 70 68 Q 72 50 75 38 Z" fill="url(#emeraldBtn)" opacity="0.85"/>

  <!-- Left D-Pad Cross (Emerald Green) -->
  <g transform="translate(30, 48)">
    <rect x="-10" y="-3.5" width="20" height="7" rx="2" fill="url(#emeraldBtn)" stroke="url(#goldCtrl)" stroke-width="1"/>
    <rect x="-3.5" y="-10" width="7" height="20" rx="2" fill="url(#emeraldBtn)" stroke="url(#goldCtrl)" stroke-width="1"/>
  </g>

  <!-- Right Action Buttons (4 Emerald Gem Dots) -->
  <g transform="translate(70, 48)">
    <circle cx="0" cy="-8" r="3.5" fill="url(#emeraldBtn)" stroke="url(#goldCtrl)" stroke-width="1"/>
    <circle cx="-8" cy="0" r="3.5" fill="url(#emeraldBtn)" stroke="url(#goldCtrl)" stroke-width="1"/>
    <circle cx="8" cy="0" r="3.5" fill="url(#emeraldBtn)" stroke="url(#goldCtrl)" stroke-width="1"/>
    <circle cx="0" cy="8" r="3.5" fill="url(#emeraldBtn)" stroke="url(#goldCtrl)" stroke-width="1"/>
  </g>

  <!-- Center Jewel / Logo Emblem -->
  <circle cx="50" cy="42" r="6" fill="url(#emeraldBtn)" stroke="url(#goldCtrl)" stroke-width="2"/>
  <circle cx="50" cy="42" r="2.5" fill="#FFF59D"/>

  <!-- Joysticks (Left and Right Thumbsticks) -->
  <circle cx="41" cy="58" r="7" fill="url(#goldCtrl)" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="41" cy="58" r="4" fill="url(#emeraldBtn)"/>

  <circle cx="59" cy="58" r="7" fill="url(#goldCtrl)" stroke="#B45309" stroke-width="1.5"/>
  <circle cx="59" cy="58" r="4" fill="url(#emeraldBtn)"/>
</svg>
