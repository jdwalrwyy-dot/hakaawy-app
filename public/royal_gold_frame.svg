<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2340" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Bright Warm Golden Background Gradient -->
    <radialGradient id="bgGlowBright" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FFFDF0"/>
      <stop offset="65%" stop-color="#FFEAA0"/>
      <stop offset="85%" stop-color="#FFD659"/>
      <stop offset="100%" stop-color="#F2B705"/>
    </radialGradient>

    <!-- Top Soft Light Beam -->
    <radialGradient id="topBeam" cx="50%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFF6C2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFEAA0" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom Corner Rays Glow -->
    <radialGradient id="cornerBeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FFE57F" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFC107" stop-opacity="0"/>
    </radialGradient>

    <!-- Pure Metallic 3D Gold Gradient Primary -->
    <linearGradient id="goldPure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="20%" stop-color="#FFE169"/>
      <stop offset="45%" stop-color="#F5B000"/>
      <stop offset="65%" stop-color="#FFF3A8"/>
      <stop offset="85%" stop-color="#C78700"/>
      <stop offset="100%" stop-color="#FFE885"/>
    </linearGradient>

    <!-- Gold Accent Vertical -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0"/>
      <stop offset="30%" stop-color="#EAA000"/>
      <stop offset="60%" stop-color="#FFF2A3"/>
      <stop offset="90%" stop-color="#B87B00"/>
      <stop offset="100%" stop-color="#FFE680"/>
    </linearGradient>

    <!-- Gold Shadow & Glow Filters -->
    <filter id="goldGlowBright" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadowDark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7A4D00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. BASE BRIGHT GOLDEN BACKGROUND -->
  <rect width="1080" height="2340" fill="url(#bgGlowBright)"/>
  
  <!-- 2. TOP LIGHT BEAM OVERLAY -->
  <rect width="1080" height="1000" fill="url(#topBeam)"/>

  <!-- 3. GLOWING SPARKLES / LIGHT PARTICLES -->
  <g opacity="0.8">
    <circle cx="150" cy="720" r="4" fill="#FFFFFF" filter="url(#goldGlowBright)"/>
    <circle cx="930" cy="720" r="4" fill="#FFFFFF" filter="url(#goldGlowBright)"/>
    <circle cx="100" cy="1650" r="5" fill="#FFFFFF" filter="url(#goldGlowBright)"/>
    <circle cx="980" cy="1650" r="5" fill="#FFFFFF" filter="url(#goldGlowBright)"/>
    <circle cx="220" cy="2180" r="6" fill="#FFFFFF" filter="url(#goldGlowBright)"/>
    <circle cx="860" cy="2180" r="6" fill="#FFFFFF" filter="url(#goldGlowBright)"/>
    <circle cx="540" cy="2250" r="5" fill="#FFFFFF" filter="url(#goldGlowBright)"/>
    <circle cx="340" cy="2270" r="3.5" fill="#FFFFFF"/>
    <circle cx="740" cy="2270" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- 4. SIDE GOLDEN PILLARS / DOUBLE BORDER FRAME -->
  <!-- Left Outer Pillar Line -->
  <rect x="24" y="24" width="28" height="2292" rx="6" fill="url(#goldPure)" filter="url(#dropShadowDark)"/>
  <rect x="32" y="32" width="12" height="2276" rx="3" fill="url(#goldAccent)"/>

  <!-- Right Outer Pillar Line -->
  <rect x="1028" y="24" width="28" height="2292" rx="6" fill="url(#goldPure)" filter="url(#dropShadowDark)"/>
  <rect x="1036" y="32" width="12" height="2276" rx="3" fill="url(#goldAccent)"/>

  <!-- Inner Fine Gold Guidelines -->
  <line x1="68" y1="200" x2="68" y2="2140" stroke="url(#goldPure)" stroke-width="3" opacity="0.8"/>
  <line x1="1012" y1="200" x2="1012" y2="2140" stroke="url(#goldPure)" stroke-width="3" opacity="0.8"/>

  <!-- 5. TOP GRAND ISLAMIC GOLDEN ARCH & FILIGREE (مطابق للصورة) -->
  <g filter="url(#dropShadowDark)">
    <!-- Main Center Arch Curve -->
    <path d="M 24,200 L 24,140 Q 24,40 180,40 Q 360,40 540,160 Q 720,40 900,40 Q 1056,40 1056,140 L 1056,200 Z" fill="url(#goldPure)"/>
    
    <!-- Outer Arch Crest Ornament -->
    <path d="M 24,120 C 180,20 360,20 540,140 C 720,20 900,20 1056,120 L 1056,0 L 24,0 Z" fill="url(#goldAccent)"/>

    <!-- Inner Carved Filigree Texture on Arch -->
    <path d="M 120,60 Q 540,220 960,60" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.6"/>
    <path d="M 160,80 Q 540,240 920,80" fill="none" stroke="url(#goldPure)" stroke-width="4"/>

    <!-- Arch Top Ornate Border Trim -->
    <path d="M 24,18 Q 540,-10 1056,18" stroke="url(#goldPure)" stroke-width="12" fill="none"/>
    
    <!-- Center Top Arch Dome Peak -->
    <path d="M 460,40 Q 540,-20 620,40 Q 540,20 460,40 Z" fill="url(#goldPure)"/>
    <circle cx="540" cy="10" r="10" fill="#FFFFFF" filter="url(#goldGlowBright)"/>
  </g>

  <!-- 6. HANGING GOLDEN LANTERNS (4 فوانيس معلقة) -->
  <!-- Lantern 1 (Outer Left) -->
  <line x1="100" y1="40" x2="100" y2="180" stroke="url(#goldPure)" stroke-width="3"/>
  <g transform="translate(100, 180)" filter="url(#dropShadowDark)">
    <circle cx="0" cy="40" r="35" fill="url(#cornerBeam)"/>
    <path d="M -16,0 L 16,0 L 22,15 L -22,15 Z" fill="url(#goldPure)"/>
    <path d="M -20,15 L -12,65 L 12,65 L 20,15 Z" fill="#FFF8DC" fill-opacity="0.8" stroke="url(#goldPure)" stroke-width="3"/>
    <ellipse cx="0" cy="40" rx="6" ry="12" fill="#FFD500"/>
    <path d="M -15,65 L 15,65 L 10,80 L -10,80 Z" fill="url(#goldPure)"/>
    <path d="M -3,80 L 0,98 L 3,80 Z" fill="url(#goldPure)"/>
  </g>

  <!-- Lantern 2 (Inner Left under Main Arch) -->
  <line x1="250" y1="80" x2="250" y2="110" stroke="url(#goldPure)" stroke-width="3.5"/>
  <g transform="translate(250, 110)" filter="url(#dropShadowDark)">
    <circle cx="0" cy="45" r="45" fill="url(#cornerBeam)"/>
    <path d="M -20,0 L 20,0 L 28,18 L -28,18 Z" fill="url(#goldPure)"/>
    <path d="M -25,18 L -15,75 L 15,75 L 25,18 Z" fill="#FFFFFF" fill-opacity="0.85" stroke="url(#goldPure)" stroke-width="4"/>
    <ellipse cx="0" cy="45" rx="8" ry="16" fill="#FFC107"/>
    <path d="M -18,75 L 18,75 L 12,92 L -12,92 Z" fill="url(#goldPure)"/>
    <path d="M -4,92 L 0,115 L 4,92 Z" fill="url(#goldPure)"/>
  </g>

  <!-- Lantern 3 (Inner Right under Main Arch) -->
  <line x1="830" y1="80" x2="830" y2="110" stroke="url(#goldPure)" stroke-width="3.5"/>
  <g transform="translate(830, 110)" filter="url(#dropShadowDark)">
    <circle cx="0" cy="45" r="45" fill="url(#cornerBeam)"/>
    <path d="M -20,0 L 20,0 L 28,18 L -28,18 Z" fill="url(#goldPure)"/>
    <path d="M -25,18 L -15,75 L 15,75 L 25,18 Z" fill="#FFFFFF" fill-opacity="0.85" stroke="url(#goldPure)" stroke-width="4"/>
    <ellipse cx="0" cy="45" rx="8" ry="16" fill="#FFC107"/>
    <path d="M -18,75 L 18,75 L 12,92 L -12,92 Z" fill="url(#goldPure)"/>
    <path d="M -4,92 L 0,115 L 4,92 Z" fill="url(#goldPure)"/>
  </g>

  <!-- Lantern 4 (Outer Right) -->
  <line x1="980" y1="40" x2="980" y2="180" stroke="url(#goldPure)" stroke-width="3"/>
  <g transform="translate(980, 180)" filter="url(#dropShadowDark)">
    <circle cx="0" cy="40" r="35" fill="url(#cornerBeam)"/>
    <path d="M -16,0 L 16,0 L 22,15 L -22,15 Z" fill="url(#goldPure)"/>
    <path d="M -20,15 L -12,65 L 12,65 L 20,15 Z" fill="#FFF8DC" fill-opacity="0.8" stroke="url(#goldPure)" stroke-width="3"/>
    <ellipse cx="0" cy="40" rx="6" ry="12" fill="#FFD500"/>
    <path d="M -15,65 L 15,65 L 10,80 L -10,80 Z" fill="url(#goldPure)"/>
    <path d="M -3,80 L 0,98 L 3,80 Z" fill="url(#goldPure)"/>
  </g>

  <!-- 7. BOTTOM CORNER ORNATE GOLDEN FLOURISHES & LIGHT RAYS (مطابق لقاعدة الصورة) -->
  <!-- Bottom Corner Glowing Light Halos -->
  <circle cx="80" cy="2260" r="220" fill="url(#cornerBeam)"/>
  <circle cx="1000" cy="2260" r="220" fill="url(#cornerBeam)"/>

  <!-- Light Beams Shooting Upward from Bottom Corners -->
  <polygon points="24,2316 200,2050 280,2100 24,2340" fill="#FFFFFF" opacity="0.35"/>
  <polygon points="1056,2316 880,2050 800,2100 1056,2340" fill="#FFFFFF" opacity="0.35"/>

  <!-- Bottom Left Gold Carved Flourish / Wings -->
  <g filter="url(#dropShadowDark)">
    <!-- Base Bottom Bar Left -->
    <path d="M 24,2300 L 400,2300 Q 400,2340 24,2340 Z" fill="url(#goldPure)"/>
    <!-- Upward Swooping Wing Motif -->
    <path d="M 24,2316 C 80,2200 140,2050 220,2020 C 180,2120 120,2250 24,2316 Z" fill="url(#goldPure)"/>
    <path d="M 24,2316 C 100,2230 180,2120 250,2100 C 200,2180 120,2270 24,2316 Z" fill="url(#goldAccent)"/>
    <!-- Inner Carved Scroll -->
    <circle cx="215" cy="2035" r="14" fill="url(#goldPure)"/>
    <circle cx="215" cy="2035" r="7" fill="#FFF5C0"/>
  </g>

  <!-- Bottom Right Gold Carved Flourish / Wings (Symmetric) -->
  <g filter="url(#dropShadowDark)">
    <!-- Base Bottom Bar Right -->
    <path d="M 1056,2300 L 680,2300 Q 680,2340 1056,2340 Z" fill="url(#goldPure)"/>
    <!-- Upward Swooping Wing Motif -->
    <path d="M 1056,2316 C 1000,2200 940,2050 860,2020 C 900,2120 960,2250 1056,2316 Z" fill="url(#goldPure)"/>
    <path d="M 1056,2316 C 980,2230 900,2120 830,2100 C 880,2180 960,2270 1056,2316 Z" fill="url(#goldAccent)"/>
    <!-- Inner Carved Scroll -->
    <circle cx="865" cy="2035" r="14" fill="url(#goldPure)"/>
    <circle cx="865" cy="2035" r="7" fill="#FFF5C0"/>
  </g>

  <!-- Bottom Center Gold Connecting Bar & Trim -->
  <rect x="24" y="2316" width="1032" height="20" rx="4" fill="url(#goldPure)" filter="url(#dropShadowDark)"/>
  <rect x="100" y="2320" width="880" height="12" rx="2" fill="url(#goldAccent)"/>
</svg>
